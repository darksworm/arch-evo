# ── Background ──────────────────────────────────────────────
background {
    monitor =
    path = ~/.config/hypr/hyprlock/wall.jpg
}

general {
    no_fade_in = true
    no_fade_out = true
    hide_cursor = true
    grace = 0
    disable_loading_bar = true
}

# ── Date ────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %b")"
    color = rgba(255, 255, 255, 0.9)
    font_size = 60
    font_family = JetBrainsMono Nerd Font
    position = 0, 375
    halign = center
    valign = center
}

# ── Time (hours) ────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H")"
    color = rgba(172, 166, 180, 1)
    font_size = 120
    font_family = JetBrainsMono Nerd Font, Heavy
    position = -15, 180
    halign = center
    valign = center
}

# ── Time (minutes) ──────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%M")"
    color = rgba(255, 255, 255, 1)
    font_size = 120
    font_family = JetBrainsMono Nerd Font, Heavy
    position = 15, 45
    halign = center
    valign = center
}

# ── Foreground (mountains overlay) ──────────────────────────
background {
    monitor =
    zindex = 1
    path = ~/.config/hypr/hyprlock/fg.png
    keep_aspect_ratio = true
    rounding = 0
    border_size = 0
}

# ── Password ────────────────────────────────────────────────
input-field {
    monitor =
    size = 310, 80
    outline_thickness = 2
    outer_color = rgba(0, 0, 0, 0.15)
    inner_color = rgba(0, 0, 0, 0.15)
    font_color = rgba(255, 255, 255, 1)
    fade_on_empty = false
    rounding = 20
    dots_size = 0.15
    dots_spacing = 0.35
    dots_center = true
    check_color = rgba(255, 255, 255, 1)
    placeholder_text = <span foreground="##ffffff">Password...</span>
    hide_input = false
    font_family = JetBrainsMono Nerd Font
    fail_color = rgb(ff6e5e)
    fail_text = <i>$FAIL</i>
    fail_transition = 300
    position = 0, -420
    halign = center
    valign = center
    zindex = 1
}
