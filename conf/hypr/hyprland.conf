# Hyprland config — arch-evo

# ── Appearance ──────────────────────────────────────────────
general {
    border_size = 2
    gaps_in = 4
    gaps_out = 4

    # cyberdream palette
    col.inactive_border = 0xff3c4048
    col.active_border = 0xff5ea1ff
}

decoration {
    rounding = 0
}

animations {
    enabled = true

    animation = windows, 1, 2, default, slide
    animation = windowsOut, 1, 2, default, slide
    animation = fade, 1, 2, default
    animation = workspaces, 1, 2, default
}

# ── Input ────────────────────────────────────────────────────
input {
    kb_layout = lv
    repeat_rate = 50
    repeat_delay = 300

    natural_scroll = true
    accel_profile = adaptive

    touchpad {
        tap-to-click = true
        natural_scroll = true
        disable_while_typing = true
        clickfinger_behavior = true
        scroll_factor = 0.7
    }

    follow_mouse = 1
}

# ── Keyball44 Trackball ──────────────────────────────────────
device {
    name = yowkees-keyball44-mouse
    scroll_factor = 0.3
}

# ── TrackPoint ───────────────────────────────────────────────
# Middle button hold + nub movement = scroll
# Verify name with: hyprctl devices
device {
    name = tpps/2-elan-trackpoint
    scroll_method = on_button_down
    scroll_button = 274
    scroll_factor = 0.7
}

# ── Monitor ─────────────────────────────────────────────────
monitor = ,preferred,auto,1
workspace = 1, default:true
workspace = 2
workspace = 3
workspace = 4

# ── Environment ─────────────────────────────────────────────
env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = MOZ_ENABLE_WAYLAND,1
env = QT_QPA_PLATFORM,wayland
env = SDL_VIDEODRIVER,wayland
env = _JAVA_AWT_WM_NONREPARENTING,1
env = CLUTTER_BACKEND,wayland
env = NO_AT_BRIDGE,1
env = PATH,$HOME/.local/share/mise/shims:$PATH
env = JAVA_HOME,$HOME/.local/share/mise/installs/java/21.0.2

# ── Autostart ───────────────────────────────────────────────
exec-once = awww-daemon
exec-once = matuwall
exec-once = waybar
exec-once = sleep 2 && pypr
exec-once = dunst
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = wl-paste --watch cliphist store
exec-once = hypridle
exec-once = wlsunset -l 56.9 -L 24.1 -t 4200 -T 6500
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = eval $(ssh-agent)
exec-once = sh -c 'while true; do ~/.local/bin/check_battery; sleep 60; done'
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# ── Window Rules ────────────────────────────────────────────
windowrule = workspace 2 silent, match:class zen-browser
windowrule = float on, match:class pavucontrol

# hyper scratchpads — pyprland manages position/size, but needs float on
windowrule = float on, match:class Slack
windowrule = float on, match:class vesktop
windowrule = float on, match:class spotify
windowrule = float on, match:class linear-linux

# terminal workspace — foot always lives here
windowrule = workspace 1 silent, match:class foot-scratch

# ── Keybindings ─────────────────────────────────────────────
$mod = SUPER
$hyper = CTRL ALT SUPER

# launch
bind = $mod, Return, exec, foot
bind = $mod, D, exec, fuzzel
bind = $mod, V, exec, cliphist list | fuzzel -d | cliphist decode | wl-copy
bind = $mod, C, exec, zen-browser

# close window
bind = $mod SHIFT, Q, killactive

# named workspaces
bind = $mod, grave, workspace, 1
bind = $mod SHIFT, grave, movetoworkspace, 1
bind = $mod, 1, workspace, 2
bind = $mod SHIFT, 1, movetoworkspace, 2
bind = $mod, 2, workspace, 3
bind = $mod SHIFT, 2, movetoworkspace, 3
bind = $mod, 3, workspace, 4
bind = $mod SHIFT, 3, movetoworkspace, 4
exec-once = foot --app-id foot-scratch -T foot-scratch

# hyper scratchpads — pyprland handles launch + hide/show
bind = $hyper, S, exec, pypr-toggle slack
bind = $hyper, D, exec, pypr-toggle discord
bind = $hyper, M, exec, pypr-toggle spotify
bind = $hyper, L, exec, pypr-toggle linear

# focus
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u

# master area
bind = $mod, H, splitratio, -0.05
bind = $mod, L, splitratio, +0.05
bind = $mod, Tab, workspace, previous

# layout
bind = $mod, T, layoutmsg, setlayout dwindle
bind = $mod, F, togglefloating
bind = $mod, M, fullscreen, 1
bind = $mod, E, fullscreen, 0
bind = $mod, space, togglefloating

# monitor focus
bind = $mod, period, focusmonitor, +1
bind = $mod, comma, focusmonitor, -1
bind = $mod SHIFT, greater, movewindow, mon:+1
bind = $mod SHIFT, less, movewindow, mon:-1

# screenshots & lock
bind = SUPER SHIFT, S, exec, screenshot region
bind = $mod, F12, exec, hyprlock
bind = $mod CTRL, Q, exec, hyprlock

# media keys
bindl = , XF86AudioRaiseVolume, exec, volume-control up
bindl = , XF86AudioLowerVolume, exec, volume-control down
bindl = , XF86AudioMute, exec, volume-control mute
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86MonBrightnessUp, exec, backlight-control up
bindl = , XF86MonBrightnessDown, exec, backlight-control down

# workspaces (5-9)
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 5, movetoworkspace, 5

bind = $mod, 6, workspace, 6
bind = $mod SHIFT, 6, movetoworkspace, 6

bind = $mod, 7, workspace, 7
bind = $mod SHIFT, 7, movetoworkspace, 7

bind = $mod, 8, workspace, 8
bind = $mod SHIFT, 8, movetoworkspace, 8

bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 9, movetoworkspace, 9

# quit
bind = $mod SHIFT CTRL, Q, exit

# mouse bindings
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
