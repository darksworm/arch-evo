# Hyprland config — arch-evo

# ── Appearance ──────────────────────────────────────────────
general {
    border_size = 2
    gaps_in = 4
    gaps_out = 4

    # cyberdream palette
    col.inactive_border = 0xff3c4048
    col.active_border = 0xff5ea1ff
}

decoration {
    rounding = 0
}

animations {
    enabled = true

    animation = windows, 1, 2, default, slide
    animation = windowsOut, 1, 2, default, slide
    animation = fade, 1, 2, default
    animation = workspaces, 1, 2, default
}

# ── Input ────────────────────────────────────────────────────
input {
    kb_layout = lv
    repeat_rate = 50
    repeat_delay = 300

    accel_profile = adaptive

    touchpad {
        tap-to-click = true
        natural_scroll = true
        disable_while_typing = true
        clickfinger_behavior = false
        scroll_factor = 1.0
    }

    follow_mouse = 1
}

# ── Monitor ─────────────────────────────────────────────────
monitor = ,preferred,auto,1

# ── Environment ─────────────────────────────────────────────
env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = MOZ_ENABLE_WAYLAND,1
env = QT_QPA_PLATFORM,wayland
env = SDL_VIDEODRIVER,wayland
env = _JAVA_AWT_WM_NONREPARENTING,1
env = CLUTTER_BACKEND,wayland
env = NO_AT_BRIDGE,1

# ── Autostart ───────────────────────────────────────────────
exec-once = swww-daemon
exec-once = sleep 0.5 && swww img ~/.local/share/wallpapers/default.jpg --transition-type fade
exec-once = waybar
exec-once = dunst
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = hypridle
exec-once = wlsunset -l 56.9 -L 24.1 -t 4200 -T 6500
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = eval $(ssh-agent)
exec-once = sh -c 'while true; do ~/.local/bin/check_battery; sleep 60; done'
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# ── Window Rules ────────────────────────────────────────────
windowrule = workspace 1 silent, match:class zen-browser
windowrule = float on, match:class pavucontrol

# hyper scratchpads — float, 75x87% centered (mirrors AeroSpace setup)
windowrule = workspace special:slack silent, match:class slack
windowrule = float on, match:class slack
windowrule = size 75% 87%, match:class slack
windowrule = center on, match:class slack

windowrule = workspace special:discord silent, match:class discord
windowrule = float on, match:class discord
windowrule = size 75% 87%, match:class discord
windowrule = center on, match:class discord

windowrule = workspace special:spotify silent, match:class Spotify
windowrule = float on, match:class Spotify
windowrule = size 75% 87%, match:class Spotify
windowrule = center on, match:class Spotify

windowrule = workspace special:linear silent, match:class [Ll]inear
windowrule = float on, match:class [Ll]inear
windowrule = size 75% 87%, match:class [Ll]inear
windowrule = center on, match:class [Ll]inear

# terminal scratchpad
windowrule = size 1280 800, match:class foot-scratch
windowrule = center on, match:class foot-scratch

# ── Keybindings ─────────────────────────────────────────────
$mod = ALT
$hyper = CTRL ALT SUPER

# launch
bind = $mod, Return, exec, foot
bind = $mod, D, exec, fuzzel
bind = $mod, C, exec, zen-browser

# close window
bind = $mod SHIFT, Q, killactive

# terminal scratchpad
bind = $mod, grave, togglespecialworkspace, scratchpad
bind = $mod SHIFT, grave, movetospecialworkspacesilent, scratchpad
exec-once = foot --app-id foot-scratch -T foot-scratch

# hyper scratchpads — launch app if not running, then toggle
bind = $hyper, S, exec, ~/.local/bin/app-toggle slack slack
bind = $hyper, D, exec, ~/.local/bin/app-toggle discord discord
bind = $hyper, M, exec, ~/.local/bin/app-toggle spotify spotify
bind = $hyper, L, exec, ~/.local/bin/app-toggle linear linear-desktop

# focus
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u

# master area
bind = $mod, H, splitratio, -0.05
bind = $mod, L, splitratio, +0.05
bind = $mod, Tab, workspace, previous

# layout
bind = $mod, T, layoutmsg, setlayout dwindle
bind = $mod, F, togglefloating
bind = $mod, M, fullscreen, 1
bind = $mod, E, fullscreen, 0
bind = $mod, space, togglefloating

# monitor focus
bind = $mod, period, focusmonitor, +1
bind = $mod, comma, focusmonitor, -1
bind = $mod SHIFT, greater, movewindow, mon:+1
bind = $mod SHIFT, less, movewindow, mon:-1

# screenshots & lock
bind = CTRL SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy
bind = $mod, F12, exec, hyprlock

# media keys
bindl = , XF86AudioRaiseVolume, exec, volume-control up
bindl = , XF86AudioLowerVolume, exec, volume-control down
bindl = , XF86AudioMute, exec, volume-control mute
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86MonBrightnessUp, exec, backlight-control up
bindl = , XF86MonBrightnessDown, exec, backlight-control down

# workspaces (1-9)
bind = $mod, 1, workspace, 1
bind = $mod CTRL, 1, workspace, 1
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod CTRL SHIFT, 1, movetoworkspacesilent, 1

bind = $mod, 2, workspace, 2
bind = $mod CTRL, 2, workspace, 2
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod CTRL SHIFT, 2, movetoworkspacesilent, 2

bind = $mod, 3, workspace, 3
bind = $mod CTRL, 3, workspace, 3
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod CTRL SHIFT, 3, movetoworkspacesilent, 3

bind = $mod, 4, workspace, 4
bind = $mod CTRL, 4, workspace, 4
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod CTRL SHIFT, 4, movetoworkspacesilent, 4

bind = $mod, 5, workspace, 5
bind = $mod CTRL, 5, workspace, 5
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod CTRL SHIFT, 5, movetoworkspacesilent, 5

bind = $mod, 6, workspace, 6
bind = $mod CTRL, 6, workspace, 6
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod CTRL SHIFT, 6, movetoworkspacesilent, 6

bind = $mod, 7, workspace, 7
bind = $mod CTRL, 7, workspace, 7
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod CTRL SHIFT, 7, movetoworkspacesilent, 7

bind = $mod, 8, workspace, 8
bind = $mod CTRL, 8, workspace, 8
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod CTRL SHIFT, 8, movetoworkspacesilent, 8

bind = $mod, 9, workspace, 9
bind = $mod CTRL, 9, workspace, 9
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod CTRL SHIFT, 9, movetoworkspacesilent, 9

bind = $mod, 0, workspace, 10

# quit
bind = $mod SHIFT CTRL, Q, exit

# mouse bindings
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
