[pyprland]
plugins = ["scratchpads"]

# 75x87% centered — mirrors AeroSpace scratchpad setup
# lazy = true means app only launches on first keypress, not at startup

[scratchpads.slack]
command = "slack"
class = "Slack"
size = "75% 87%"
position = "13% 7%"
lazy = true

[scratchpads.discord]
command = "vesktop"
class = "vesktop"
size = "75% 87%"
position = "13% 7%"
lazy = true

[scratchpads.spotify]
command = "spotify"
class = "spotify"
size = "75% 87%"
position = "13% 7%"
lazy = true

[scratchpads.linear]
command = "linear-linux"
class = "linear-linux"
size = "75% 87%"
position = "13% 7%"
lazy = true
