[pyprland]
plugins = ["scratchpads"]

# 75x87% centered — mirrors AeroSpace scratchpad setup
# lazy = true means app only launches on first keypress, not at startup

[scratchpads.slack]
command = "slack"
class = "slack"
size = "75% 87%"
position = "13% 7%"
lazy = true
process_tracking = false

[scratchpads.discord]
command = "vesktop"
class = "vesktop"
match_by = "initialTitle"
initialTitle = "Discord"
size = "75% 87%"
position = "13% 7%"
lazy = true
process_tracking = false

[scratchpads.spotify]
command = "spotify"
class = "spotify"
size = "75% 87%"
position = "13% 7%"
lazy = true
process_tracking = false

[scratchpads.linear]
command = "linear-linux"
class = "linear-linux"
size = "75% 87%"
position = "13% 7%"
lazy = true
process_tracking = false

# Teams PWA installed from (snap) Chromium; the Wayland app_id is
# chrome-<app-id>-<profile>, not the crx_ StartupWMClass in its .desktop
[scratchpads.teams]
command = "chromium --profile-directory=Default --app-id=ompifgpmddkgmclendfeacglnodjjndh"
class = "chrome-ompifgpmddkgmclendfeacglnodjjndh-Default"
size = "75% 87%"
position = "13% 7%"
lazy = true
process_tracking = false
