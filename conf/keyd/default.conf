[ids]
*

[main]
# tap = Esc, hold = Ctrl+Alt+Super (hyper)
capslock = overload(hyper, esc)

# Firmware emits raw F1/F2/F3 for the volume/mute keys regardless of Fn state.
# Translate to XF86Audio* so Hyprland's audio binds fire.
f1 = mute
f2 = volumedown
f3 = volumeup

[hyper:C-M-A]
# All keys pressed while capslock is held get Ctrl+Alt+Super applied
